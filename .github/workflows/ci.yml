name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Ruff (PEP-8)
        run: |
          ruff check .
          ruff format --check .

      - name: import-linter (Clean Architecture)
        run: lint-imports

      - name: Pytest
        # Código 5 = nenhum teste encontrado. Remover o "|| ..." quando
        # existirem testes.
        run: pytest --cov --cov-report=term-missing || test $? -eq 5
