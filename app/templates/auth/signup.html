{% extends "base.html" %}

{% block title %}Criar conta - Cafeteca{% endblock %}

{% block content %}
<h1>Criar conta</h1>
{% if error %}
<p class="form-error" role="alert">
  {{ error }}
  {% if login_path %}<a href="{{ login_path }}">Entrar</a>{% endif %}
</p>
{% endif %}
<form method="post" action="{{ url_for('auth.signup') }}" class="form">
  <label for="display_name">Nome de exibição</label>
  <input id="display_name" name="display_name" type="text" required
         value="{{ form.get('display_name', '') }}">

  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required
         value="{{ form.get('email', '') }}">

  <label for="password">Senha</label>
  <input id="password" name="password" type="password" required>
  <p class="hint">
    Pelo menos 8 caracteres, com pelo menos uma letra e um número.
  </p>

  <button type="submit">Criar conta</button>
</form>
{% endblock %}
